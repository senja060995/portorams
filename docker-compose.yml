services:
  db:
    image: postgres:16-alpine
    container_name: rams_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rams_db
      POSTGRES_USER: rams
      POSTGRES_PASSWORD: rams_password
    ports:
      - "5432:5432"
    volumes:
      - rams_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rams -d rams_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rams_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://rams:rams_password@db:5432/rams_db?sslmode=disable"
      JWT_SECRET: "rams_jwt_secret_change_me_in_production_2026"
      GIN_MODE: "release"
      PUBLIC_API_URL: "https://rams.biz.id"
    volumes:
      - rams_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rams_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      API_URL: "http://backend:8080/api"
    depends_on:
      - backend

volumes:
  rams_postgres_data:
  rams_uploads:
